openapi: 3.1.0
info:
  title: Vinyl Shelf API
  version: 0.11.0
  summary: Collection browsing, audio recognition and taste-based discovery for vinyl collectors.
  description: |
    Contract-first API for the Vinyl Shelf web app (working title). This file is the
    source of truth: server validation and client types are generated from it.
    See docs/adr/0001-contract-first-api.md.

    **Discogs data.** Fields sourced from Discogs carry `fetchedAt` and `expiresAt`.
    Clients MUST NOT display a Discogs-sourced value after `expiresAt`, and MUST render
    the attribution required by Discogs' API Terms of Use on every screen that shows
    it (see docs/adr/0004-discogs-data-lifecycle.md, note of 2026-10-25). `discogsUrl`
    links a record to its Discogs page.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
tags:
  - name: Auth
    description: Discogs OAuth login and the current session.
  - name: Collection
    description: Importing and browsing the user's Discogs collection.
  - name: Releases
    description: Release detail and manual search.
  - name: Wantlist
    description: The records the user is looking for, read live from Discogs.
  - name: Taste
    description: |
      Recommendations from the user's shelf, from the CC0 taste catalogue
      (docs/adr/0008-taste-engine.md).
  - name: Recognition
    description: Listen sessions, audio upload and recognition results.
  - name: Meta
    description: Operational endpoints.

security:
  - sessionCookie: []

paths:
  /health:
    get:
      tags: [Meta]
      operationId: getHealth
      summary: Liveness and readiness probe
      security: []
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]

  /auth/discogs/start:
    get:
      tags: [Auth]
      operationId: startDiscogsLogin
      summary: Begin the Discogs OAuth 1.0a flow
      description: |
        Redirects the browser to Discogs' authorization page. The request-token secret is
        kept in a short-lived encrypted cookie until the callback (see
        docs/adr/0006-sessions-tokens-and-shelf-references.md).
      security: []
      responses:
        '302':
          description: Redirect to Discogs.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: Short-lived encrypted request-token cookie.
              schema: { type: string }
        '429':
          description: |
            Too many login attempts from this client. Each attempt spends one request of
            the Discogs budget shared by every user, so it is limited per client.
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'

  /auth/discogs/callback:
    get:
      tags: [Auth]
      operationId: finishDiscogsLogin
      summary: OAuth callback; establishes a session
      description: |
        The browser navigates here directly, so failures redirect back to the web app
        with a `loginError` query parameter instead of returning a JSON body the user
        would be stranded on. Only a request that is not an OAuth callback at all
        (neither `oauth_token` nor `denied` present) gets a 400 problem response.
      security: []
      parameters:
        - name: oauth_token
          in: query
          schema: { type: string }
        - name: oauth_verifier
          in: query
          schema: { type: string }
        - name: denied
          in: query
          description: Sent by the provider instead of a verifier when the user declines.
          schema: { type: string }
      responses:
        '302':
          description: |
            On success, the session cookie is set and the browser is redirected to the
            app. On failure, the browser is redirected to the app with
            `?loginError=<LoginErrorCode>` and no session is created.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/Problem'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the session
      responses:
        '204':
          description: Session ended.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'

  /me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current user
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Problem'

  /collection/facets:
    get:
      tags: [Collection]
      operationId: getCollectionFacets
      summary: What the user's shelf can be filtered by
      description: |
        The genres, styles, decades and colourways on the user's vinyl shelf, each with
        how many records have it, for the library's filters. Counted over records whose
        Discogs data is fresh (ADR 0004); `expiresAt` is when the first of them expires.
      responses:
        '200':
          description: The shelf's facets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionFacets'
        '401':
          $ref: '#/components/responses/Problem'

  /collection/imports:
    post:
      tags: [Collection]
      operationId: startCollectionImport
      summary: Start (or resume) importing the user's Discogs collection
      description: |
        Idempotent per user: if an import is already queued or running, that job is
        returned instead of creating a second one. Imports are resumable and
        checkpointed server-side (see docs/adr/0003-postgres-as-job-queue.md).
        An explicit request is not subject to the automatic-refresh cooldown described
        on `CollectionRefresh`.
      responses:
        '202':
          description: Import accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'

  /collection/imports/latest:
    get:
      tags: [Collection]
      operationId: getLatestCollectionImport
      summary: The user's most recent import job
      description: |
        Lets a client that has lost the job id (for example after a reload) find a
        running import, including one started automatically by a refresh.
      responses:
        '200':
          description: The most recently created import job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /collection/imports/{importId}:
    get:
      tags: [Collection]
      operationId: getCollectionImport
      summary: Poll an import job
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: Current job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /collection/items:
    get:
      tags: [Collection]
      operationId: listCollectionItems
      summary: List the user's collection (cursor-paginated)
      description: |
        Stale-while-revalidate with a cutoff (docs/adr/0004-discogs-data-lifecycle.md):
        items whose Discogs data is past `expiresAt` are never returned. They are
        counted in `refresh.hiddenCount`, and the server starts a background refresh
        import when needed. The `refresh` object tells the client which of these states
        it is in, so an expired shelf renders as "refreshing", not as empty.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque cursor from a previous page.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [added_desc, added_asc, artist_asc, year_asc, year_desc]
            default: added_desc
        - name: genre
          in: query
          description: Only records with this Discogs genre (exact, as listed by `/collection/facets`).
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: style
          in: query
          description: Only records with this Discogs style (exact, as listed by `/collection/facets`).
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: decade
          in: query
          description: Only records released in this decade, given by its first year (1970 for the 1970s).
          schema: { type: integer, minimum: 1900, maximum: 2090, multipleOf: 10 }
        - name: colourway
          in: query
          description: |
            `coloured` for records whose colourway Discogs names, `black` for the rest
            (see `ReleaseSummary.vinylColors`).
          schema: { type: string, enum: [coloured, black] }
      responses:
        '200':
          description: A page of collection items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Collection]
      operationId: addCollectionItem
      summary: Add a release to the user's Discogs collection
      description: |
        Writes the release to the user's Discogs collection (folder 1, "Uncategorized"),
        then puts it on the shelf (docs/adr/0009-writing-to-the-discogs-collection.md).
        Discogs is written first; if that fails nothing changes here.

        Discogs allows several copies of a release, so a release already on the shelf is
        refused with 409 `already_in_collection` unless `allowDuplicate` is true. Clients
        set it only after the user confirms they own another copy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [discogsId]
              additionalProperties: false
              properties:
                discogsId: { type: integer, minimum: 1 }
                allowDuplicate: { type: boolean, default: false }
      responses:
        '201':
          description: Added; the new copy as it now appears on the shelf.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          description: |
            Not signed in, or Discogs access was revoked (`code: discogs_auth_revoked`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          description: |
            No such release on Discogs (`code: release_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            Already on the shelf and `allowDuplicate` was not set
            (`code: already_in_collection`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'

  /wantlist:
    get:
      tags: [Wantlist]
      operationId: listWantlist
      summary: One page of the user's Discogs wantlist, newest first
      description: |
        Read live from Discogs and never stored as a list
        (docs/adr/0011-the-wantlist.md). Each release carries `fetchedAt` and
        `expiresAt` like any Discogs data. All formats are included.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: One page of the wantlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WantlistPage'
        '401':
          description: |
            Not signed in, or Discogs access was revoked (`code: discogs_auth_revoked`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'

  /wantlist/{discogsId}:
    parameters:
      - name: discogsId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    put:
      tags: [Wantlist]
      operationId: addToWantlist
      summary: Add a release to the user's Discogs wantlist
      description: |
        Idempotent: adding a release already wanted returns it unchanged (ADR 0011).
      responses:
        '200':
          description: The release as it now stands on the wantlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WantlistItem'
        '401':
          description: |
            Not signed in, or Discogs access was revoked (`code: discogs_auth_revoked`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          description: |
            No such release on Discogs (`code: release_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Wantlist]
      operationId: removeFromWantlist
      summary: Remove a release from the user's Discogs wantlist
      description: Removing a release that is not wanted is treated as done.
      responses:
        '204':
          description: No longer on the wantlist.
        '401':
          description: |
            Not signed in, or Discogs access was revoked (`code: discogs_auth_revoked`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'

  /releases/{discogsId}:
    get:
      tags: [Releases]
      operationId: getRelease
      summary: Release detail
      description: |
        Full detail for one Discogs release (tracklist, credits, formats, colourways),
        served from the TTL-bound cache and fetched from Discogs when missing or
        expired (ADR 0004). Like every Discogs-sourced response it carries
        `fetchedAt` and `expiresAt`.
      parameters:
        - name: discogsId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'

  /releases/{discogsId}/previews:
    get:
      tags: [Releases]
      operationId: getReleasePreviews
      summary: 30-second previews for a release's tracks
      description: |
        Matches the release's tracklist to songs in the iTunes Store and returns a
        30-second preview URL for each track that matched with confidence
        (docs/adr/0010-track-previews-from-itunes.md). Looked up on first request and
        cached for 24 hours, including "no match". The audio streams from Apple to the
        client and is never stored.

        Clients MUST show `attribution` and a link to `albumUrl` (with Apple's approved
        badge) wherever previews play. A release with no match returns 200 with
        `albumUrl: null` and every `previewUrl` null.
      parameters:
        - name: discogsId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The release's previews, as far as they could be matched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleasePreviews'
        '401':
          description: |
            Not signed in, or Discogs access was revoked (`code: discogs_auth_revoked`)
            while fetching the tracklist to match.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: |
            No such release on Discogs (`code: release_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: |
            The iTunes Store or Discogs is unavailable (`code: previews_unavailable` or
            `discogs_unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /search/releases:
    get:
      tags: [Releases]
      operationId: searchReleases
      summary: Search Discogs for vinyl releases
      description: |
        Search by title, artist, catalogue number or barcode, to add a record to the
        shelf (and, later, as the fallback when recognition fails). Limited to vinyl
        releases. Results are Discogs data passed straight through: never stored, shown
        with the Discogs credit, and subject to `expiresAt` like any other
        (docs/adr/0009-writing-to-the-discogs-collection.md). Search has its own per-user
        rate limit, since every user shares one Discogs request budget.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 200 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: One page of search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          description: |
            Not signed in, or Discogs access was revoked (`code: discogs_auth_revoked`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'

  /taste/recommendations:
    get:
      tags: [Taste]
      operationId: getTasteRecommendations
      summary: Records the user is likely to love, grouped by the sides of their shelf
      description: |
        The shelf is split into rooms, its sides, and each room gets its own picks, each
        with a reason that names shelf records bearing it out (ADR 0008, Notes
        2026-10-26). Picks come from the taste catalogue, built from Discogs' CC0 data
        dumps (ADR 0012), so they carry no `expiresAt`; they still credit Discogs.

        The same shelf, feedback and catalogue always give the same answer. `status`
        says why there are no rooms, when there are none:

        - `no_catalogue`: no taste catalogue is loaded on this server;
        - `too_few_records`: fewer than three shelf or wanted records are in the
          catalogue (`basedOn` says how many are), for example straight after the
          first import.
      parameters:
        - name: distance
          in: query
          description: |
            `near` stays close to the shelf and favours artists the user does not own
            (at most one pick per room by an artist already on the shelf); `far` reaches
            further, trades some accuracy for range and only suggests new artists.
          schema:
            type: string
            enum: [near, far]
            default: near
      responses:
        '200':
          description: Recommendations, or why there are none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasteRecommendations'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'

  /taste/search:
    get:
      tags: [Taste]
      operationId: searchByDescription
      summary: Records that fit a description, leaning towards the user's taste
      description: |
        Semantic search over the taste catalogue (ADR 0008 §2): the description is
        embedded with the catalogue's own model, on our server, and matched by meaning,
        not keywords ("moody 70s jazz with strings"). Records on the shelf or marked "not
        for me" are left out; among close matches, those near the shelf's sides come
        first. Picks carry the same reasons as recommendations. Nothing about the
        shelf leaves our server.
      parameters:
        - name: q
          in: query
          required: true
          description: What to look for, in the user's own words.
          schema: { type: string, minLength: 2, maxLength: 200 }
      responses:
        '200':
          description: Matches, best first, or why there are none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasteSearch'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          description: |
            Search is not set up on this server (`code: search_unavailable`): its
            embedding model is not installed, or the loaded catalogue was built with a
            different one.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /taste/feedback:
    post:
      tags: [Taste]
      operationId: giveTasteFeedback
      summary: Steer recommendations with "more like this" or "not for me"
      description: |
        `more` treats the record as if it were on the shelf, so it pulls picks its way;
        `less` keeps it, and records very like it, out of the picks. Neither is
        recommended again. A new verdict on the same record replaces the old one. Kept
        as catalogue ids with the user's account (ADR 0008).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TasteFeedback'
      responses:
        '204':
          description: Recorded; the next recommendations take it into account.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          description: |
            Not a record in the taste catalogue (`code: master_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /taste/feedback/{masterId}:
    parameters:
      - name: masterId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    delete:
      tags: [Taste]
      operationId: withdrawTasteFeedback
      summary: Take back a verdict
      description: Withdrawing a verdict that was never given is treated as done.
      responses:
        '204':
          description: No verdict on this record any more.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'

  /listen-sessions:
    post:
      tags: [Recognition]
      operationId: createListenSession
      summary: Open a listen session
      description: |
        A listen session groups recognition attempts for one client. Today it maps 1:1 to
        a browser tab; it exists so a second device can attach later (phone pairing)
        without changing the attempt flow. See docs/adr/0002.
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListenSession'
        '401':
          $ref: '#/components/responses/Problem'

  /listen-sessions/{sessionId}/attempts:
    post:
      tags: [Recognition]
      operationId: createRecognitionAttempt
      summary: Create a recognition attempt
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source:
                  $ref: '#/components/schemas/CaptureSource'
      responses:
        '201':
          description: Attempt created in state `created`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecognitionAttempt'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /recognition-attempts/{attemptId}/audio:
    put:
      tags: [Recognition]
      operationId: uploadAttemptAudio
      summary: Upload the audio clip for an attempt
      description: |
        Short clip only (the recognition vendor analyses roughly the first 12 seconds;
        the server enforces a 10 MB cap). The clip is processed and discarded; it is
        never persisted.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: true
        content:
          audio/webm: { schema: { type: string, format: binary } }
          audio/mp4: { schema: { type: string, format: binary } }
          audio/mpeg: { schema: { type: string, format: binary } }
          audio/wav: { schema: { type: string, format: binary } }
      responses:
        '202':
          description: Clip accepted; result will arrive on the event stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecognitionAttempt'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Attempt is not in a state that accepts audio.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'

  /recognition-attempts/{attemptId}:
    get:
      tags: [Recognition]
      operationId: getRecognitionAttempt
      summary: Current state of an attempt (polling fallback)
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: The attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecognitionAttempt'
        '404':
          $ref: '#/components/responses/Problem'

  /recognition-attempts/{attemptId}/events:
    get:
      tags: [Recognition]
      operationId: streamAttemptEvents
      summary: Server-sent event stream for one attempt
      description: |
        Emits an `attempt` event with a full `RecognitionAttempt` payload on every state
        transition, then closes the stream once the attempt reaches a terminal state.
        Supports `Last-Event-ID` so a reconnecting client receives the current state
        immediately.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE frames: `event: attempt` and `data: <RecognitionAttempt JSON>`.
        '404':
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid

  parameters:
    ImportId:
      name: importId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ForbiddenOrigin:
      description: |
        The request's `Origin` does not match the web app (CSRF protection for
        cookie-authenticated unsafe methods).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Upstream or local rate limit reached.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable machine-readable error code.

    User:
      type: object
      required: [id, discogsUsername]
      properties:
        id: { type: string, format: uuid }
        discogsUsername: { type: string }

    ImportJob:
      type: object
      required: [id, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        progress:
          type: object
          properties:
            fetched: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
        error:
          $ref: '#/components/schemas/Problem'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LoginErrorCode:
      type: string
      enum: [access_denied, invalid_request_token, discogs_unavailable]
      description: |
        Value of the `loginError` query parameter the callback redirects with.
        `access_denied`: the user declined on Discogs. `invalid_request_token`: the
        request token is missing, expired or does not match. `discogs_unavailable`:
        Discogs failed or could not be reached.

    CollectionPage:
      type: object
      description: |
        The shelf holds vinyl only. A release counts as vinyl when any of its formats is
        Vinyl (an LP-and-CD box set is on the shelf); CDs, cassettes and other formats
        in the Discogs collection are left off and counted in `otherFormatsCount`.
        Releases whose formats are not yet known (cached before 0.5.0) are treated as
        vinyl until the next import.
      required: [items, totalItems, otherFormatsCount, matchedItems, refresh]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionItem'
        totalItems:
          type: integer
          minimum: 0
          description: |
            Vinyl records on the user's shelf, including any withheld while their data
            refreshes (`refresh.hiddenCount`). The same on every page.
        otherFormatsCount:
          type: integer
          minimum: 0
          description: |
            Releases in the user's Discogs collection that are not vinyl, and so are not
            on the shelf. The same on every page.
        matchedItems:
          type: integer
          minimum: 0
          description: |
            Records that match the filters given (genre, style, decade, colourway), among
            those whose data is fresh. Equal to the visible shelf when no filter is given.
            The same on every page.
        nextCursor:
          type: [string, 'null']
        refresh:
          $ref: '#/components/schemas/CollectionRefresh'

    CollectionFacets:
      type: object
      required: [genres, styles, decades, colourways, expiresAt]
      properties:
        genres:
          type: array
          description: Most records first, then by name.
          items:
            $ref: '#/components/schemas/FacetCount'
        styles:
          type: array
          description: Most records first, then by name.
          items:
            $ref: '#/components/schemas/FacetCount'
        decades:
          type: array
          description: Oldest first. Records with no known year are not counted.
          items:
            type: object
            required: [decade, count]
            properties:
              decade:
                type: integer
                description: The decade's first year, e.g. 1970.
              count: { type: integer, minimum: 1 }
        colourways:
          type: object
          required: [coloured, black]
          properties:
            coloured: { type: integer, minimum: 0 }
            black: { type: integer, minimum: 0 }
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: When the first counted record's data expires; null for an empty shelf.

    FacetCount:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer, minimum: 1 }

    CollectionRefresh:
      type: object
      required: [status, importId, hiddenCount, retryAt]
      description: |
        Freshness of the user's shelf. Describes the whole shelf, not just this page.

        - `idle`: no refresh in progress. If `items` is empty and `hiddenCount` is 0,
          the shelf really is empty.
        - `refreshing`: a refresh import (`importId`) is queued or running. Clients
          SHOULD render `hiddenCount` placeholders rather than an empty list, and poll
          the import.
        - `backoff`: the latest import failed recently, so the server is not starting
          another one until `retryAt` (a cooldown that protects the Discogs rate
          limit). Clients SHOULD say the shelf could not be refreshed and when it will
          retry. `POST /collection/imports` remains available for an explicit retry.
      properties:
        status:
          type: string
          enum: [idle, refreshing, backoff]
        importId:
          type: [string, 'null']
          format: uuid
          description: The refreshing import, or the failed one in `backoff`.
        hiddenCount:
          type: integer
          minimum: 0
          description: Shelf items withheld because their Discogs data is past `expiresAt`.
        retryAt:
          type: [string, 'null']
          format: date-time
          description: Set only in `backoff`; earliest time an automatic refresh starts.

    CollectionItem:
      type: object
      required: [instanceId, release, dateAdded]
      properties:
        instanceId:
          type: integer
          description: Discogs collection instance id (a user may own several copies).
        release:
          $ref: '#/components/schemas/ReleaseSummary'
        dateAdded: { type: string, format: date-time }

    ReleaseSummary:
      type: object
      required: [discogsId, title, artists, vinylColors, discogsUrl, fetchedAt, expiresAt]
      properties:
        discogsId: { type: integer }
        title: { type: string }
        artists:
          type: array
          items: { type: string }
        year: { type: [integer, 'null'] }
        vinylColors:
          type: array
          items: { type: string }
          description: |
            Colourways named in the release's Discogs format text, e.g. ["Blue Marbled"].
            Empty when Discogs names none; clients must not invent a colour (render
            standard black).
        coverImageUrl:
          type: [string, 'null']
          format: uri
          description: Hotlinked Discogs image URL. Never stored; subject to `expiresAt`.
        discogsUrl:
          type: string
          format: uri
          description: Link target for the mandatory "Data provided by Discogs" credit.
        fetchedAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: Hard display deadline (at most 6 hours after `fetchedAt`).

    Release:
      allOf:
        - $ref: '#/components/schemas/ReleaseSummary'
        - type: object
          required: [label, catalogNumber, genres, styles, formats, tracklist, credits, community]
          properties:
            community:
              type: object
              description: |
                What the Discogs community says about this release: its average rating
                and how many members own it and want it. Discogs data, shown with the
                Discogs credit.
              required: [rating, have, want]
              properties:
                rating:
                  type: object
                  required: [average, count]
                  properties:
                    average:
                      type: number
                      minimum: 0
                      maximum: 5
                      description: Mean of the community's 1 to 5 ratings; 0 when unrated.
                    count: { type: integer, minimum: 0 }
                have: { type: integer, minimum: 0 }
                want: { type: integer, minimum: 0 }
            label: { type: [string, 'null'] }
            catalogNumber: { type: [string, 'null'] }
            genres:
              type: array
              items: { type: string }
            styles:
              type: array
              items: { type: string }
            formats:
              type: array
              items: { type: string }
              description: Format lines as Discogs describes them, e.g. "Vinyl, LP, Album".
            credits:
              type: array
              description: Release-level credits (the liner notes), in Discogs order.
              items:
                type: object
                required: [name, role]
                properties:
                  name: { type: string }
                  role: { type: string }
            tracklist:
              type: array
              items:
                type: object
                required: [position, title]
                properties:
                  position: { type: string }
                  title: { type: string }
                  duration: { type: [string, 'null'] }

    ReleasePreviews:
      type: object
      required: [discogsId, albumUrl, attribution, tracks, fetchedAt, expiresAt]
      properties:
        discogsId: { type: integer }
        albumUrl:
          type: [string, 'null']
          format: uri
          description: |
            The matched album in the iTunes Store, the target of Apple's badge. Null when
            nothing matched.
        attribution:
          type: string
          description: Text Apple requires beside previews, shown as given.
        tracks:
          type: array
          description: One entry per track of `Release.tracklist`, in the same order.
          items:
            type: object
            required: [position, previewUrl, storeUrl]
            properties:
              position:
                type: string
                description: The track's `position` in `Release.tracklist`.
              previewUrl:
                type: [string, 'null']
                format: uri
                description: 30 seconds of audio, streamed only. Null when unmatched.
              storeUrl:
                type: [string, 'null']
                format: uri
                description: The matched song in the iTunes Store.
        fetchedAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: When the match is looked up again (24 hours after `fetchedAt`).

    WantlistPage:
      type: object
      required: [items, page, pages, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WantlistItem'
        page: { type: integer, minimum: 1 }
        pages: { type: integer, minimum: 0 }
        totalItems:
          type: integer
          minimum: 0
          description: Releases on the wantlist, all formats.

    WantlistItem:
      type: object
      required: [release, dateAdded]
      properties:
        release:
          $ref: '#/components/schemas/ReleaseSummary'
        dateAdded: { type: string, format: date-time }

    SearchPage:
      type: object
      required: [results, page, pages, totalResults]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        page: { type: integer, minimum: 1 }
        pages: { type: integer, minimum: 0 }
        totalResults: { type: integer, minimum: 0 }

    SearchResult:
      type: object
      description: |
        A release as Discogs search describes it: enough to recognise the right pressing
        and add it. Fetch `/releases/{discogsId}` for the full detail.
      required:
        [
          discogsId,
          title,
          artists,
          year,
          country,
          label,
          catalogNumber,
          formats,
          thumbUrl,
          discogsUrl,
          inCollection,
          inWantlist,
          fetchedAt,
          expiresAt,
        ]
      properties:
        discogsId: { type: integer }
        title: { type: string }
        artists:
          type: array
          items: { type: string }
        year: { type: [integer, 'null'] }
        country: { type: [string, 'null'] }
        label: { type: [string, 'null'] }
        catalogNumber: { type: [string, 'null'] }
        formats:
          type: array
          items: { type: string }
          description: Format descriptors as Discogs lists them, e.g. ["Vinyl", "LP", "Album"].
        thumbUrl:
          type: [string, 'null']
          format: uri
          description: Hotlinked Discogs thumbnail. Never stored; subject to `expiresAt`.
        discogsUrl:
          type: string
          format: uri
          description: Link target for the mandatory "Data provided by Discogs" credit.
        inCollection:
          type: boolean
          description: |
            At least one copy is already on the user's shelf (as of their last import),
            so adding it needs `allowDuplicate`. Same check as the 409 on
            `addCollectionItem`.
        inWantlist:
          type: boolean
          description: On the user's Discogs wantlist, as Discogs reports with the result.
        fetchedAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: Hard display deadline (at most 6 hours after `fetchedAt`).

    CaptureSource:
      type: string
      enum: [laptop_mic, file_upload, paired_phone]
      description: |
        `paired_phone` is reserved for the deferred phone-pairing feature and is
        rejected by the server until it ships.

    ListenSession:
      type: object
      required: [id, createdAt]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    AttemptStatus:
      type: string
      enum:
        - created
        - capturing
        - uploaded
        - recognizing
        - matched
        - no_match
        - failed
        - expired

    RecognitionAttempt:
      type: object
      required: [id, sessionId, source, status, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        source:
          $ref: '#/components/schemas/CaptureSource'
        status:
          $ref: '#/components/schemas/AttemptStatus'
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: Attempts not completed by this time move to `expired`.
        result:
          oneOf:
            - $ref: '#/components/schemas/RecognitionResult'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/Problem'
            - type: 'null'

    RecognitionResult:
      type: object
      required: [track, candidateReleases]
      properties:
        track:
          type: object
          required: [title, artist]
          properties:
            title: { type: string }
            artist: { type: string }
            album: { type: [string, 'null'] }
        candidateReleases:
          type: array
          description: Vinyl pressings matched on Discogs. May be empty.
          items:
            $ref: '#/components/schemas/ReleaseSummary'

    TasteRecommendations:
      type: object
      required: [status, catalogue, basedOn, rooms]
      properties:
        status:
          type: string
          enum: [ready, no_catalogue, too_few_records]
        catalogue:
          description: The loaded taste catalogue; null when none is.
          oneOf:
            - type: object
              required: [dump, rows]
              properties:
                dump:
                  type: string
                  description: The Discogs data dump it was built from, e.g. "20261001".
                rows: { type: integer, minimum: 0 }
            - type: 'null'
        basedOn:
          type: object
          required: [shelfRecords, inCatalogue, wanted]
          properties:
            shelfRecords:
              type: integer
              minimum: 0
              description: Records on the shelf.
            inCatalogue:
              type: integer
              minimum: 0
              description: Of those, how many the catalogue knows, which the picks come from.
            wanted:
              description: |
                Records on the user's Discogs wantlist that the catalogue knows: they shape
                the picks like "more like this" and are never suggested back. Read live
                for this answer and not kept (ADR 0011, note of 2026-10-28). Null when
                the wantlist could not be read; the picks then come from the shelf alone.
              oneOf:
                - type: integer
                  minimum: 0
                - type: 'null'
        rooms:
          type: array
          description: Largest room first. Empty unless `status` is `ready`.
          items:
            $ref: '#/components/schemas/TasteRoom'

    TasteSearch:
      type: object
      required: [status, query, results]
      properties:
        status:
          type: string
          enum: [ready, no_catalogue]
          description: '`no_catalogue`: no taste catalogue is loaded on this server.'
        query:
          type: string
          description: The description as searched, trimmed.
        results:
          type: array
          description: Best first; at most one record per artist. Empty without a catalogue.
          items:
            $ref: '#/components/schemas/TastePick'

    TasteRoom:
      type: object
      required: [id, styles, size, picks]
      properties:
        id:
          type: string
          description: Stable while the shelf and feedback stay the same.
        styles:
          type: array
          description: The room's commonest styles, most common first; what it is called.
          items: { type: string }
        size:
          type: integer
          minimum: 1
          description: Shelf records in the room, counting those marked "more like this".
        picks:
          type: array
          description: Best first. No record appears in two rooms.
          items:
            $ref: '#/components/schemas/TastePick'

    TastePick:
      type: object
      required: [master, reason]
      properties:
        master:
          $ref: '#/components/schemas/CatalogueMaster'
        reason:
          $ref: '#/components/schemas/TasteReason'

    CatalogueMaster:
      type: object
      description: |
        An album across its pressings (a Discogs master), from the CC0 taste catalogue.
        It has no image: a client shows a cover through `/releases/{mainReleaseId}`.
      required: [masterId, mainReleaseId, title, artists, year, genres, styles, labels, discogsUrl]
      properties:
        masterId: { type: integer }
        mainReleaseId:
          type: integer
          description: The release Discogs picks to stand for the master.
        title: { type: string }
        artists:
          type: array
          items: { type: string }
        year: { type: [integer, 'null'] }
        genres:
          type: array
          items: { type: string }
        styles:
          type: array
          items: { type: string }
        labels:
          type: array
          items: { type: string }
        discogsUrl:
          type: string
          format: uri
          description: The master's page on Discogs.

    TasteReason:
      type: object
      description: |
        Why the record is picked, built from catalogue facts by our code, never invented
        (ADR 0008 §2): what it sounds like, whose fans it is for, and a link to the shelf
        when there is a real one (ADR 0008, Notes 2026-10-28).
      required: [sound, fansOf, link]
      properties:
        sound:
          type: string
          description: Its styles and era, e.g. "Boogie and Disco, early '80s".
        fansOf:
          type: array
          maxItems: 2
          description: |
            Artists on the shelf whose records sound closest to it, closest first; never
            the pick's own artist. May be empty.
          items: { type: string }
        link:
          description: |
            The strongest real link to the shelf, or null: `people` (a producer, engineer
            or player behind shelf records), `artist` (more by an artist on the shelf),
            `label` (the same label in the same decade).
          oneOf:
            - $ref: '#/components/schemas/TasteLink'
            - type: 'null'

    TasteLink:
      type: object
      required: [kind, text, shelfTitles]
      properties:
        kind:
          type: string
          enum: [people, artist, label]
        text:
          type: string
          description: One short line, e.g. "Produced by Maurice White, who's on 4 of your records".
        shelfTitles:
          type: array
          maxItems: 3
          description: Titles of the shelf records that bear the link out.
          items: { type: string }

    TasteFeedback:
      type: object
      required: [masterId, verdict]
      properties:
        masterId: { type: integer, minimum: 1 }
        verdict:
          type: string
          enum: [more, less]
